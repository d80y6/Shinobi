name: DAM VMS CI

on:
  push:
    branches: [ main, master, rebrand-dam-vms ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm install
      - name: Run Tests
        run: node test/run.js
      - name: Lint Code
        run: npm run lint

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t dam-vms:latest .
